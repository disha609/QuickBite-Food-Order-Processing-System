version: "3.9"

services:
  mongodb:
    image: mongo
    container_name: mongodb-quickservice
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  zookeeper:
    image: wurstmeister/zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"

  kafka:
    image: wurstmeister/kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_HOST_NAME: kafka
      KAFKA_CREATE_TOPICS: "order_events:1:1,user_events:1:1,menu_events:1:1,auth_events:1:1"
    depends_on:
      - zookeeper

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "4000:4000"
    env_file:
      - .env
    depends_on:
      - mongodb
      - kafka
    environment:
      - MONGO_URI=mongodb://mongodb:27017/authdb
      - KAFKA_BROKER=kafka:9092
      - JWT_SECRET=your_jwt_secret_here

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "4001:4001"
    env_file:
      - .env
    depends_on:
      - mongodb
      - kafka
    environment:
      - MONGO_URI=mongodb://mongodb:27017/userdb
      - KAFKA_BROKER=kafka:9092
      - JWT_SECRET=your_jwt_secret_here

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - mongodb
      - kafka
    environment:
      - MONGO_URI=mongodb://mongodb:27017/orderdb
      - KAFKA_BROKER=kafka:9092
      - JWT_SECRET=your_jwt_secret_here

  menu-service:
    build: ./menu-service
    container_name: menu-service
    ports:
      - "4002:4002"
    env_file:
      - .env
    depends_on:
      - mongodb
      - kafka
    environment:
      - MONGO_URI=mongodb://mongodb:27017/menudb
      - KAFKA_BROKER=kafka:9092
      - JWT_SECRET=your_jwt_secret_here

volumes:
  mongo_data:
